# Builds the HAC fork of JavaScript Injector for Jellyfin 12.4 on GitHub's
# runners. A tag v*-hac builds, attests and publishes a release with the zip and
# its SHA-256; a push to the custom branch, or a manual run, builds and uploads
# the zip as an artifact only.
# Every action is pinned to a full commit SHA; no secrets are used beyond the
# job's own short-lived GITHUB_TOKEN.
name: build

on:
  push:
    branches:
      - custom
    tags:
      - "v*-hac"
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PLUGIN_DIR: Jellyfin.Plugin.JavaScriptInjector
  ZIP_NAME: Jellyfin.Plugin.JavaScriptInjector_HAC_12.4.zip
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET (exact SDK from global.json)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Package versions come from packages.lock.json in locked mode. Until that
      # file is committed, a branch build generates it and uploads it (artifact
      # "nuget-lock") to be reviewed and committed; a tag build refuses to run
      # without it, so no release is ever built unlocked.
      - name: Restore
        id: restore
        run: |
          set -euo pipefail
          proj="$PLUGIN_DIR/Jellyfin.Plugin.JavaScriptInjector.csproj"
          if [ -f "$PLUGIN_DIR/packages.lock.json" ]; then
            dotnet restore "$proj" -p:JellyfinTarget=jf12 --locked-mode
            echo "locked=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::No packages.lock.json is committed; a release must restore in locked mode."
            exit 1
          else
            dotnet restore "$proj" -p:JellyfinTarget=jf12
            echo "::warning::No packages.lock.json committed yet; generated one (artifact nuget-lock). Review and commit it."
            echo "locked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the generated lock file
        if: steps.restore.outputs.locked == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-lock
          path: ${{ env.PLUGIN_DIR }}/packages.lock.json
          if-no-files-found: error
          retention-days: 30

      - name: Build (Jellyfin 12.4, Release)
        run: |
          dotnet build "$PLUGIN_DIR/Jellyfin.Plugin.JavaScriptInjector.csproj" \
            --configuration Release --no-restore -p:JellyfinTarget=jf12 \
            -p:ContinuousIntegrationBuild=true -p:Deterministic=true

      - name: Package
        id: pack
        run: |
          set -euo pipefail
          dll="$PLUGIN_DIR/bin/Release/net10.0/Jellyfin.Plugin.JavaScriptInjector.dll"
          test -f "$dll"
          # A tag must match the built version (v4.1.0.1-hac -> 4.1.0.1).
          version=$(grep -oP '(?<=<AssemblyVersion>)[^<]+' "$PLUGIN_DIR/Jellyfin.Plugin.JavaScriptInjector.csproj")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            test "${tag%-hac}" = "$version" || { echo "tag $tag does not match version $version"; exit 1; }
          fi
          grep -q "\"version\": \"$version\"" packaging/meta.json || { echo "meta.json version is not $version"; exit 1; }
          mkdir -p out/pkg
          cp "$dll" out/pkg/
          stamp=$(git log -1 --format=%cI)
          sed "s/__TIMESTAMP__/$stamp/" packaging/meta.json > out/pkg/meta.json
          python3 -c "import json,sys; json.load(open('out/pkg/meta.json'))"
          # Fixed file times and order, so the same commit gives the same zip.
          find out/pkg -exec touch -d "$stamp" {} +
          (cd out/pkg && zip -X -D "../$ZIP_NAME" Jellyfin.Plugin.JavaScriptInjector.dll meta.json)
          # The zip holds exactly the plugin DLL and meta.json.
          test "$(unzip -Z1 "out/$ZIP_NAME" | sort | tr '\n' ' ')" = "Jellyfin.Plugin.JavaScriptInjector.dll meta.json "
          (cd out && sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256")
          echo "sha256=$(cut -d' ' -f1 "out/$ZIP_NAME.sha256")" >> "$GITHUB_OUTPUT"
          cat "out/$ZIP_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: |
            out/${{ env.ZIP_NAME }}
            out/${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-hac')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: out

      - name: Check the hash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd out
          sha256sum -c "$ZIP_NAME.sha256"
          test "$(cut -d' ' -f1 "$ZIP_NAME.sha256")" = "$EXPECTED_SHA256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ env.ZIP_NAME }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "JavaScript Injector (HAC) $TAG" \
            --notes "HAC fork of JavaScript Injector 4.1.0.0 for Jellyfin 12.4. See CUSTOM_CHANGES.md. SHA-256: $ZIP_SHA256" \
            --verify-tag \
            "out/$ZIP_NAME" "out/$ZIP_NAME.sha256"
